    <style>
        :root {
            --bg-glass: rgba(10, 15, 25, 0.7);
            --bg-glass-heavy: rgba(10, 15, 25, 0.9);
            --accent-blue: hsl(210, 100%, 60%);
            --accent-green: hsl(145, 100%, 50%);
            --accent-red: hsl(0, 100%, 60%);
            --accent-orange: hsl(30, 100%, 55%);
            --text-main: #ffffff;
            --text-dim: rgba(255, 255, 255, 0.6);
            --border-glass: rgba(255, 255, 255, 0.1);
            --shadow-premium: 0 8px 32px rgba(0, 0, 0, 0.5);
            --transition-smooth: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Outfit', sans-serif;
            background: #05080f;
            color: var(--text-main);
        }

        canvas {
            display: block;
        }

        /* Dashboard Container */
        .dashboard-ui {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1000;
            display: grid;
            grid-template-areas: 
                "top-left top-center top-right"
                "mid-left mid-center mid-right"
                "bot-left bot-center bot-right";
            grid-template-rows: 1fr 1fr 1fr;
            grid-template-columns: 1fr 1fr 1fr;
            padding: 24px;
        }

        .ui-area {
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Glassmorphism Panel */
        .glass-panel {
            background: var(--bg-glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            padding: 16px;
            box-shadow: var(--shadow-premium);
            transition: var(--transition-smooth);
        }

        .glass-panel:hover {
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        /* HUD Items */
        .hud-group {
            grid-area: top-left;
        }

        .hud-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 240px;
        }

        .hud-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-dim);
            font-weight: 600;
        }

        .hud-value {
            font-size: 16px;
            font-weight: 500;
            font-family: 'Monaco', 'Consolas', monospace;
            color: var(--accent-blue);
        }

        /* Control Center (Bottom Center) */
        .control-center {
            grid-area: bot-center;
            justify-self: center;
            align-self: end;
            background: var(--bg-glass-heavy);
            padding: 12px 24px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            gap: 16px;
            border: 1px solid var(--border-glass);
            box-shadow: var(--shadow-premium);
            pointer-events: auto;
        }

        .btn-main {
            padding: 10px 24px;
            border-radius: 20px;
            border: none;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: var(--transition-smooth);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-reload-main { background: rgba(255, 255, 255, 0.1); color: var(--text-main); }
        .btn-reload-main:hover { background: rgba(255, 255, 255, 0.2); }

        .btn-start-main { background: var(--accent-green); color: #000; }
        .btn-start-main:hover { background: hsl(145, 100%, 40%); transform: scale(1.05); }

        .btn-stop-main { background: var(--accent-red); color: #fff; }
        .btn-stop-main:hover { background: hsl(0, 100%, 40%); transform: scale(1.05); }
        .btn-reset-main:hover { background: hsl(0, 100%, 40%); transform: scale(1.05); }

        /* Sidebar removed as per request */

        /* Mission Info Overlay */
        .mission-overlay {
            grid-area: top-center;
            justify-self: center;
            text-align: center;
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
        }

        #path_info {
            font-weight: 700;
            color: var(--accent-green);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* View Controls */
        .view-controls {
            grid-area: bot-left;
            align-self: end;
        }

        .btn-pill {
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid var(--border-glass);
            background: var(--bg-glass);
            color: var(--text-main);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition-smooth);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-pill:hover {
            background: var(--border-glass);
            border-color: var(--text-dim);
        }

        .btn-pill.active {
            background: var(--accent-blue);
            color: #000;
            border-color: var(--accent-blue);
        }

        /* Legacy labels cleanup */
        .labels {
            grid-area: mid-left;
            font-size: 11px;
            opacity: 0.8;
        }

        /* Legend styles */
        /* Animations */
        @keyframes pulse-glow {
            0% { text-shadow: 0 0 5px var(--accent-blue); filter: brightness(1); }
            50% { text-shadow: 0 0 20px var(--accent-blue); filter: brightness(1.5); }
            100% { text-shadow: 0 0 5px var(--accent-blue); filter: brightness(1); }
        }

        .pulse-update {
            animation: pulse-glow 0.8s ease-out;
        }
    </style>

        function reset_exc() {
            // alert("abc")
            fetch('/reset_exc', {
                    method:'POST', 
                    headers: {
                    'Content-Type': 'application/json'
                    }
                })
                .then(response => response.json())
                .then(data => {
                    document.getElementById("path_info").innerHTML = "Mission Reset";
                    if (stop_interv) clearInterval(stop_interv);
                })
                .catch(err => console.error('Error clearing mission:', err));

            fetch('/reset_exc_trailer', {
                    method:'POST', 
                    headers: {
                    'Content-Type': 'application/json'
                    }
                })
                .then(response => response.json())
                .then(data => {
                    document.getElementById("path_info").innerHTML = "Mission Reset";
                    if (stop_interv) clearInterval(stop_interv);
                })
                .catch(err => console.error('Error clearing mission:', err));
        }

        function start_stop_check() {
            if (stop_interv) clearInterval(stop_interv);
            stop_interv = setInterval(check_stop, 1000);
        }

        function check_stop() {
            fetch('/succ_stop')
                .then(response => response.json())
                .then(result => {
                    if (result.tag === "stop") {
                        document.getElementById("path_info").innerHTML = "Mission Complete";
                        if ("vibrate" in navigator) navigator.vibrate(500);
                        const buzzSound = document.getElementById("buzzSound");
                        if (buzzSound) {
                            buzzSound.currentTime = 0;
                            buzzSound.play().catch(e => console.log("Audio play blocked"));
                        }
                        clearInterval(stop_interv);
                    }
                })
                .catch(err => console.error('Error checking mission status:', err));
        }

        function to_home() {
            window.location.href = '/map';
        }

        function save_curr_path() {
            fetch('/save_cur_path')
                .then(response => response.text())
                .then(data => {
                    document.getElementById("path_info").innerHTML = "Path Saved Successfully";
                })
                .catch(err => console.error('Error saving path:', err));
        }

        let monitor = "UBLOX";
        let view_option = 0;
        let reset_view_tag = 0;

        function switch_monitor(mon) {
            monitor = mon;
        }

        function switch_view(v) {
            view_option = parseInt(v);
            document.querySelectorAll('.view-controls .btn-pill').forEach(btn => btn.classList.remove('active'));
            if (v === '0') {
                document.getElementById('v1btn').classList.add('active');
                smooth_camera_transition({ x: 0, y: 50, z: 0 }, { x: 0, y: 0, z: 0 });
            }
            else if (v === '1') {
                document.getElementById('v2btn').classList.add('active');
            }
        }

        function smooth_camera_transition(pos, target) {
            new TWEEN.Tween(camera.position)
                .to(pos, 1000)
                .easing(TWEEN.Easing.Quadratic.Out)
                .start();
            
            new TWEEN.Tween(controls.target)
                .to(target, 1000)
                .easing(TWEEN.Easing.Quadratic.Out)
                .onUpdate(() => controls.update())
                .start();
        }

        function save_gps() {
            fetch('/ublox_gps_before_shift.json')
                .then(response => response.json())
                .then(data => {
                    document.getElementById("path_info").innerHTML = "GPS Calibration Reset";
                })
                .catch(err => console.error('Error resetting GPS:', err));
        }

        function reg_path(opt) {
            fetch('/path_reg_x5?opt=' + opt)
                .then(response => response.json())
                .then(result => {

                })
                .catch(err => {
                    console.error('Error transforming path:', err);
                    document.getElementById("path_info").innerHTML = "Transform Failed";
                });
        }

        function setObjectOpacity(object, alpha) {
            // Traverse all children of the loaded object
            object.traverse((child) => {
                if (child.isMesh) {
                    // Handle single material or an array of materials (MultiMaterial)
                    const materials = Array.isArray(child.material) ? child.material : [child.material];
                    
                    materials.forEach(material => {
                        // 1. CRITICAL: Enable transparency
                        material.transparent = true;
                        
                        // 2. Set the desired opacity value
                        material.opacity = alpha;
                        
                        // 3. Ensure changes are registered by Three.js
                        material.needsUpdate = true; 
                    });
                }
            });
        }

        function add_vehicle(loc, turn_angle){

          rm_pre_veh();

          let group = new THREE.Group();

          // Vehicle frame points 
          const slimFactor = 0.8; // adjust to taste, less than 1 makes it slimmer
          let dx = loc[0];
          let dz = loc[1];

          // rot + scale
          const SCALE_FACTOR = 0.4;
          const ROTATION_ANGLE_DEG = turn_angle; 
          const ROTATION_AXIS = 'y';


          const points_raw = [

            // Base chassis (front to back, left to right) - scale x by slimFactor
            [-2.5 * slimFactor, 0, -4], [-1.5 * slimFactor, 0, -4], [1.5 * slimFactor, 0, -4], [2.5 * slimFactor, 0, -4],     
            [-2.7 * slimFactor, 0, -1.5], [-1.7 * slimFactor, 0, -1.5], [1.7 * slimFactor, 0, -1.5], [2.7 * slimFactor, 0, -1.5], 
            [-2.7 * slimFactor, 0, 1.5], [-1.7 * slimFactor, 0, 1.5], [1.7 * slimFactor, 0, 1.5], [2.7 * slimFactor, 0, 1.5],     
            [-2.5 * slimFactor, 0, 4], [-1.5 * slimFactor, 0, 4], [1.5 * slimFactor, 0, 4], [2.5 * slimFactor, 0, 4],             

            // Arch roofline points (arched along z-axis)
            [-1.5 * slimFactor, 1.8, -3.5], [-1.0 * slimFactor, 2.4, -2], [-0.5 * slimFactor, 2.7, 0], [0.5 * slimFactor, 2.7, 0], [1.0 * slimFactor, 2.4, -2], [1.5 * slimFactor, 1.8, -3.5],
            [-1.5 * slimFactor, 1.8, 3.5], [-1.0 * slimFactor, 2.4, 2], [-0.5 * slimFactor, 2.7, 0], [0.5 * slimFactor, 2.7, 0], [1.0 * slimFactor, 2.4, 2], [1.5 * slimFactor, 1.8, 3.5],

            // Side pillars (connect roof to base)
            [-2.5 * slimFactor, 0, -4], [-1.5 * slimFactor, 1.8, -3.5],
            [2.5 * slimFactor, 0, -4], [1.5 * slimFactor, 1.8, -3.5],
            [-2.5 * slimFactor, 0, 4], [-1.5 * slimFactor, 1.8, 3.5],
            [2.5 * slimFactor, 0, 4], [1.5 * slimFactor, 1.8, 3.5],

            // Wheel arches simplified (front and rear)
            [-2.3 * slimFactor, 0.5, -3.5], [-1.5 * slimFactor, 0.7, -3.5], [1.5 * slimFactor, 0.7, -3.5], [2.3 * slimFactor, 0.5, -3.5],  
            [-2.3 * slimFactor, 0.5, 3.5],  [-1.5 * slimFactor, 0.7, 3.5],  [1.5 * slimFactor, 0.7, 3.5],  [2.3 * slimFactor, 0.5, 3.5],  
          ];


            // Edges to connect points (by indices in points_v)
            const edges = [
              // Front bumper
              [0,1],[1,2],[2,3],
              // Mid front base
              [0,4],[1,5],[2,6],[3,7],
              [4,5],[5,6],[6,7],
              // Mid rear base
              [4,8],[5,9],[6,10],[7,11],
              [8,9],[9,10],[10,11],
              // Rear bumper
              [8,12],[9,13],[10,14],[11,15],
              [12,13],[13,14],[14,15],

              // Arch roofline (front left to right)
              [16,17],[17,18],[18,19],[19,20],[20,21],

              // Arch roofline (rear left to right)
              [22,23],[23,24],[24,25],[25,26],[26,27],

              // Roof connectors to pillars (front left)
              [16,28],[17,28],
              // Roof connectors to pillars (front right)
              [21,29],[20,29],
              // Roof connectors to pillars (rear left)
              [22,30],[23,30],
              // Roof connectors to pillars (rear right)
              [27,31],[26,31],

              // Side pillars down to base
              [28,0],[29,3],[30,12],[31,15],

              // Wheel arches (simplified)
              [32,33],[33,34],[34,35],
              [36,37],[37,38],[38,39],
            ];

          // loc
          function movePoints(points, dx = 0, dy = 0, dz = 0) {
            return points.map(([x, y, z]) => [x + dx, y + dy, z + dz]);
          }

          // let points_v = movePoints(points_raw, dx/SCALE_FACTOR, 0, dz/SCALE_FACTOR);
          let points_v = movePoints(points_raw, 0, 0, 0);

         
          // === FUNCTION: Transform Points ===
          function transformPoints(points, scale, angleDeg, axis) {
            const angleRad = THREE.MathUtils.degToRad(angleDeg);
            const euler = new THREE.Euler();
            if (axis === 'x') euler.set(angleRad, 0, 0);
            else if (axis === 'y') euler.set(0, angleRad, 0);
            else if (axis === 'z') euler.set(0, 0, angleRad);

            return points.map(p =>
              new THREE.Vector3(...p).multiplyScalar(scale).applyEuler(euler)
            );
          }

          function transformPoints2(points, scale, angleDeg, axis, dx = 0, dz = 0) {
            const angleRad = THREE.MathUtils.degToRad(angleDeg);
            const euler = new THREE.Euler();

            if (axis === 'x') euler.set(angleRad, 0, 0);
            else if (axis === 'y') euler.set(0, angleRad, 0);
            else if (axis === 'z') euler.set(0, 0, angleRad);

            const translation = new THREE.Vector3(dx, 0, dz);

            return points.map(p => {
              return new THREE.Vector3(...p)
                .multiplyScalar(scale)   // scale
                .applyEuler(euler)       // rotate
                .add(translation);       // move
            });
          }

          // === TRANSFORMED POINTS ===
          const vectorPoints = transformPoints2(points_v, SCALE_FACTOR, ROTATION_ANGLE_DEG, ROTATION_AXIS, dx, dz);

          // === CREATE GEOMETRY ===
          const geometry_v = new THREE.BufferGeometry();
          const lineVertices = [];

          edges.forEach(([i1, i2]) => {
            lineVertices.push(...vectorPoints[i1].toArray(), ...vectorPoints[i2].toArray());
          });

          geometry_v.setAttribute('position', new THREE.Float32BufferAttribute(lineVertices, 3));

          // === MATERIAL + MESH ===
          const material_v = new THREE.LineBasicMaterial({ color: 0xffffff });
          const frame_v = new THREE.LineSegments(geometry_v, material_v);
          // frame_v.name = "veh_fra_body"+real_veh_loc_history.length.toString()
          // scene.add(frame_v);
          group.add(frame_v);

        
          // Create wheel geometry (rotated so it's upright)
          const angleRad = THREE.MathUtils.degToRad(ROTATION_ANGLE_DEG);
          const euler = new THREE.Euler();

          if (ROTATION_AXIS === 'x') euler.set(angleRad, 0, 0);
          else if (ROTATION_AXIS === 'y') euler.set(0, angleRad, 0);
          else if (ROTATION_AXIS === 'z') euler.set(0, 0, angleRad);

          
          const wheelRadius = 0.6 * SCALE_FACTOR;
          const wheelThickness = 0.4 * SCALE_FACTOR;
          const wheelMaterial = new THREE.MeshStandardMaterial({ color: 0x222222 });

          const wheelGeo = new THREE.CylinderGeometry(wheelRadius, wheelRadius, wheelThickness, 16);
          wheelGeo.rotateZ(Math.PI / 2); // Rotate so flat faces are vertical


          // Wheel positions: [x, y, z]
          const wheelPositions_raw = [
            [-2.0, 0.3, -3.0], // front left
            [2.0, 0.3, -3.0],  // front right
            [-2.0, 0.3, 3.0],  // rear left
            [2.0, 0.3, 3.0],   // rear right
          ];

          // let wheelPositions = movePoints(wheelPositions_raw, dx/SCALE_FACTOR, 0, dz/SCALE_FACTOR);
          let wheelPositions = movePoints(wheelPositions_raw, 0, 0, 0);
          const translation = new THREE.Vector3(dx, 0, dz);

          wheelPositions.forEach((pos,i) => {
            // Apply transform to position
            const posVec = new THREE.Vector3(...pos)
              .multiplyScalar(SCALE_FACTOR)
              .applyEuler(euler)
              .add(translation); 

            // Create and place the wheel
            const wheel = new THREE.Mesh(wheelGeo.clone(), wheelMaterial);
            wheel.position.copy(posVec);

            // Also rotate the wheel to match car rotation
            wheel.rotation.copy(euler);

            // wheel.name = "veh_fra_wheel_"+i+"_"+real_veh_loc_history.length.toString()
            // scene.add(wheel);
            group.add(wheel);

          });

          // light
           const lightPositions_raw = [
            [-1.0, 0.8, 3.8], // front left
            [1.0, 0.8, 3.8],  // front right
          ];

          // let lightPositions = movePoints(lightPositions_raw, dx/SCALE_FACTOR, 0, dz/SCALE_FACTOR);
          let lightPositions = movePoints(lightPositions_raw, 0, 0, 0);


          const lightMaterial = new THREE.MeshStandardMaterial({ color: 0xff0000});
          const lightGeo = new THREE.SphereGeometry(0.18);

          
          lightPositions.forEach((pos,i) => {
            // Apply transform to position
            const posVec = new THREE.Vector3(...pos)
            .multiplyScalar(SCALE_FACTOR)
            .applyEuler(euler)
            .add(translation); 

            // Create and place the wheel
            const light = new THREE.Mesh(lightGeo.clone(), lightMaterial);
            light.position.copy(posVec);

            // Also rotate the wheel to match car rotation
            light.rotation.copy(euler);

            // light.name = "veh_fra_light_"+i+"_"+real_veh_loc_history.length.toString()
            // scene.add(light);
            group.add(light);

          });
          group.name = "veh_fra"+real_veh_loc_history.length.toString();
          scene.add(group);
        }

                        }
                    }
                }

                let geo = createBoatGeometry(trailer_size[0], trailer_size[1], trailer_size[2]);

                    color: 0x0000ff // Change to a "boat" blue or stay with 0xffff00

                // We rotate the L_sv offset by the vehicle's heading

        function createHitchLine(start, end, color = 0xffffff) {
            const points = [new THREE.Vector3(...start), new THREE.Vector3(...end)];
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            const material = new THREE.LineBasicMaterial({ color: color, linewidth: 2 });
            const line = new THREE.Line(geometry, material);
            return line;
        }


        function createBoatGeometry(width, length, height) {
            const shape = new THREE.Shape();
            const halfW = width / 2;
            const halfL = length / 2;

            // Start at the back-left (Stern)
            shape.moveTo(-halfW, -halfL);

            // Line to the back-right
            shape.lineTo(halfW, -halfL);

            // Line up the side to where the curve starts (the "shoulders" of the boat)
            // We start the curve earlier (at 0.0 instead of 0.2) to give the head a longer, slimmer taper
            shape.lineTo(halfW, halfL * 0.0);

            // Curve to the pointed tip (Bow)
            // Changing control point X from 'halfW' to 'halfW * 0.4' pulls the curve inward, making the head smaller
            shape.quadraticCurveTo(halfW * 0.4, halfL, 0, halfL);

            // Curve back down to the other shoulder
            shape.quadraticCurveTo(-halfW * 0.4, halfL, -halfW, halfL * 0.0);

            // Back to the start
            shape.lineTo(-halfW, -halfL);

            const extrudeSettings = {
                depth: height,
                bevelEnabled: true,
                bevelThickness: 0.1,
                bevelSize: 0.1,
                bevelSegments: 3
            };

            const geometry = new THREE.ExtrudeGeometry(shape, extrudeSettings);

            // Rotate geometry so "up" is Y, not Z (Extrude defaults to Z-axis)
            geometry.rotateX(Math.PI / 2);

            return geometry;
        }

        function loadPLYModel() {
            const loader = new THREE.PLYLoader();
            const statusElement = document.getElementById('status');
            
            statusElement.textContent = `Fetching PLY from: ${PLY_FILE_URL}`;

            // Check if the URL is the placeholder
            if (PLY_FILE_URL.includes('path/to/your/model.ply')) {
                statusElement.innerHTML = '<strong>PLEASE UPDATE:</strong> Replace the `PLY_FILE_URL` in the JavaScript with your actual `.ply` file link.';
                // Add a placeholder object since we cannot fetch the user's file
                addPlaceholderCube();
                return;
            }

            loader.load(
                // resource URL
                PLY_FILE_URL,
                // onLoad callback
                function (geometry) {
                    statusElement.textContent = 'Model loaded successfully!';
                    
                    // PLY files can contain vertex colors. 
                    // Use MeshStandardMaterial and check for vertex colors.
                    const material = new THREE.MeshStandardMaterial({
                        color: 0xffffff,
                        vertexColors: geometry.hasAttribute('color'), // Use vertex colors if available
                        flatShading: true 
                    });

                    mesh = new THREE.Mesh(geometry, material);
                    mesh.rotation.x = -Math.PI / 2; // Often PLY models are Z-up, so rotate to Y-up
                    scene.add(mesh);
                    
                    // Recenter camera to look at the loaded model
                    geometry.computeBoundingBox();
                    if (geometry.boundingBox) {
                        const center = new THREE.Vector3();
                        geometry.boundingBox.getCenter(center);
                        controls.target.copy(center);
                        
                        const size = new THREE.Vector3();
                        geometry.boundingBox.getSize(size);
                        const maxDim = Math.max(size.x, size.y, size.z);
                        
                        // Adjust camera distance based on model size
                        const fitDistance = maxDim * 1.5;
                        camera.position.set(center.x, center.y, center.z + fitDistance);
                        camera.far = fitDistance * 2;
                        camera.updateProjectionMatrix();
                    }

                },
                // onProgress callback
                function (xhr) {
                    const progress = (xhr.loaded / xhr.total) * 100;
                    statusElement.textContent = `Loading: ${progress.toFixed(2)}%`;
                },
                // onError callback
                function (error) {
                    console.error('An error occurred while loading the PLY model:', error);
                    statusElement.textContent = 'Error loading model. Check console for details.';
                    addPlaceholderCube();
                }
            );
        }


         // --- Model Loading Function ---
        function loadOBJModel() {
            // Renamed from PLYLoader to OBJLoader
            const loader = new THREE.OBJLoader();
            // const statusElement = document.getElementById('status');
            
            // statusElement.textContent = `Fetching OBJ from: ${OBJ_FILE_URL}`;

            // Check if the URL is the placeholder
            if (OBJ_FILE_URL.includes('static/cad.obj')) {
                addPlaceholderCube();
                return;
            }

            loader.load(
                // resource URL
                OBJ_FILE_URL,
                // onLoad callback
                function (object) {
                    
                    object.traverse(function (child) {
                        if (child.isMesh) {
                            child.material = new THREE.MeshStandardMaterial({
                                color: 0xcccccc,
                                flatShading: true,
                            });
                        }
                    });

                    mesh = object; // 'mesh' now refers to the loaded object group
                    scene.add(mesh);
                    
                    // Recenter camera to look at the loaded model
                    const box = new THREE.Box3().setFromObject(mesh);
                    const center = new THREE.Vector3();
                    box.getCenter(center);
                    controls.target.copy(center);
                    
                    const size = new THREE.Vector3();
                    box.getSize(size);
                    const maxDim = Math.max(size.x, size.y, size.z);
                    
                    // Adjust camera distance based on model size
                    const fitDistance = maxDim * 1.5;
                    camera.position.set(center.x, center.y, center.z + fitDistance);
                    camera.far = fitDistance * 2;
                    camera.updateProjectionMatrix();

                },
                // onProgress callback
                function (xhr) {
                    const progress = (xhr.loaded / xhr.total) * 100;
                },
                // onError callback
                function (error) {
                    addPlaceholderCube();
                }
            );
        }

        // Fallback for when the file cannot be loaded
        function addPlaceholderCube() {
            const geometry = new THREE.BoxGeometry(2, 2, 2);
            const material = new THREE.MeshStandardMaterial({ color: 0xff0000 });
            mesh = new THREE.Mesh(geometry, material);
            scene.add(mesh);
        }
