    <script>
      const header = document.getElementById('toggle-header');
      const buttonList = document.getElementById('button-list');
      let isVisible = false;

      header.addEventListener('click', () => {
        isVisible = !isVisible;
        buttonList.style.display = isVisible ? 'block' : 'none';
        header.textContent = isVisible ? 'Historical paths' : 'Historical paths';
      });

      // Optional: toggle button activation
      document.querySelectorAll('.toggle-button').forEach(button => {
        button.addEventListener('click', () => {
          button.classList.toggle('active');
        });
      });

      const btn = document.getElementById("vibrateBtn");
      const buzzSound = document.getElementById("buzzSound");
      let stop_interv = null;


      function check_stop(){

          fetch('/succ_stop') 
            .then(response => response.text())
            .then(result => {
              let feedback = JSON.parse(result).tag;
              if (feedback=="stop"){
                document.getElementById("path_info").innerHTML = "Mission complete";

                // vibrate (android only)
                if ("vibrate" in navigator) {
                  navigator.vibrate(500);
                }

                // sound (only support user click)
                const buzzSound = document.getElementById("buzzSound");
                buzzSound.currentTime = 0; // restart from start
                buzzSound.play();

                // UI

                clearInterval(stop_interv);
              }

              // else{
              //   document.getElementById("path_info").innerHTML = "Mission not complete";
              // }
            })

            .catch(err => {
              console.error('Error fetching mission data:', err);
            });
        }



      function to_home(){
        window.location.href = '/map';
      }

        function reg_path(opt){
          gen_new_path(opt)

          function gen_new_path(opt) {
            fetch('/path_reg_x5?opt='+opt) 
              .then(response => response.json())
              .then(result => {
                try {
                    const data = JSON.parse(result);
                    document.getElementById("path_info").innerHTML = "Transform path option " + opt + ": " + result;
                } catch (e) {
                    // If it's not JSON, just treat it as a string
                    document.getElementById("path_info").innerHTML = "Transform path option " + opt + ": " + result;
                }
              })

              .catch(err => {

                document.getElementById("path_info").innerHTML = "Transform fail";

        function setObjectOpacity(object, alpha) {
            // Traverse all children of the loaded object
            object.traverse((child) => {
                if (child.isMesh) {
                    // Handle single material or an array of materials (MultiMaterial)
                    const materials = Array.isArray(child.material) ? child.material : [child.material];
                    
                    materials.forEach(material => {
                        // 1. CRITICAL: Enable transparency
                        material.transparent = true;
                        
                        // 2. Set the desired opacity value
                        material.opacity = alpha;
                        
                        // 3. Ensure changes are registered by Three.js
                        material.needsUpdate = true; 
                    });
                }
            });
        }

        function add_vehicle(loc, turn_angle){

          rm_pre_veh();

          let group = new THREE.Group();

          // Vehicle frame points 
          const slimFactor = 0.8; // adjust to taste, less than 1 makes it slimmer
          let dx = loc[0];
          let dz = loc[1];

          // rot + scale
          const SCALE_FACTOR = 0.4;
          const ROTATION_ANGLE_DEG = turn_angle; 
          const ROTATION_AXIS = 'y';


          const points_raw = [

            // Base chassis (front to back, left to right) - scale x by slimFactor
            [-2.5 * slimFactor, 0, -4], [-1.5 * slimFactor, 0, -4], [1.5 * slimFactor, 0, -4], [2.5 * slimFactor, 0, -4],     
            [-2.7 * slimFactor, 0, -1.5], [-1.7 * slimFactor, 0, -1.5], [1.7 * slimFactor, 0, -1.5], [2.7 * slimFactor, 0, -1.5], 
            [-2.7 * slimFactor, 0, 1.5], [-1.7 * slimFactor, 0, 1.5], [1.7 * slimFactor, 0, 1.5], [2.7 * slimFactor, 0, 1.5],     
            [-2.5 * slimFactor, 0, 4], [-1.5 * slimFactor, 0, 4], [1.5 * slimFactor, 0, 4], [2.5 * slimFactor, 0, 4],             

            // Arch roofline points (arched along z-axis)
            [-1.5 * slimFactor, 1.8, -3.5], [-1.0 * slimFactor, 2.4, -2], [-0.5 * slimFactor, 2.7, 0], [0.5 * slimFactor, 2.7, 0], [1.0 * slimFactor, 2.4, -2], [1.5 * slimFactor, 1.8, -3.5],
            [-1.5 * slimFactor, 1.8, 3.5], [-1.0 * slimFactor, 2.4, 2], [-0.5 * slimFactor, 2.7, 0], [0.5 * slimFactor, 2.7, 0], [1.0 * slimFactor, 2.4, 2], [1.5 * slimFactor, 1.8, 3.5],

            // Side pillars (connect roof to base)
            [-2.5 * slimFactor, 0, -4], [-1.5 * slimFactor, 1.8, -3.5],
            [2.5 * slimFactor, 0, -4], [1.5 * slimFactor, 1.8, -3.5],
            [-2.5 * slimFactor, 0, 4], [-1.5 * slimFactor, 1.8, 3.5],
            [2.5 * slimFactor, 0, 4], [1.5 * slimFactor, 1.8, 3.5],

            // Wheel arches simplified (front and rear)
            [-2.3 * slimFactor, 0.5, -3.5], [-1.5 * slimFactor, 0.7, -3.5], [1.5 * slimFactor, 0.7, -3.5], [2.3 * slimFactor, 0.5, -3.5],  
            [-2.3 * slimFactor, 0.5, 3.5],  [-1.5 * slimFactor, 0.7, 3.5],  [1.5 * slimFactor, 0.7, 3.5],  [2.3 * slimFactor, 0.5, 3.5],  
          ];


            // Edges to connect points (by indices in points_v)
            const edges = [
              // Front bumper
              [0,1],[1,2],[2,3],
              // Mid front base
              [0,4],[1,5],[2,6],[3,7],
              [4,5],[5,6],[6,7],
              // Mid rear base
              [4,8],[5,9],[6,10],[7,11],
              [8,9],[9,10],[10,11],
              // Rear bumper
              [8,12],[9,13],[10,14],[11,15],
              [12,13],[13,14],[14,15],

              // Arch roofline (front left to right)
              [16,17],[17,18],[18,19],[19,20],[20,21],

              // Arch roofline (rear left to right)
              [22,23],[23,24],[24,25],[25,26],[26,27],

              // Roof connectors to pillars (front left)
              [16,28],[17,28],
              // Roof connectors to pillars (front right)
              [21,29],[20,29],
              // Roof connectors to pillars (rear left)
              [22,30],[23,30],
              // Roof connectors to pillars (rear right)
              [27,31],[26,31],

              // Side pillars down to base
              [28,0],[29,3],[30,12],[31,15],

              // Wheel arches (simplified)
              [32,33],[33,34],[34,35],
              [36,37],[37,38],[38,39],
            ];

          // loc
          function movePoints(points, dx = 0, dy = 0, dz = 0) {
            return points.map(([x, y, z]) => [x + dx, y + dy, z + dz]);
          }

          // let points_v = movePoints(points_raw, dx/SCALE_FACTOR, 0, dz/SCALE_FACTOR);
          let points_v = movePoints(points_raw, 0, 0, 0);

         
          // === FUNCTION: Transform Points ===
          function transformPoints(points, scale, angleDeg, axis) {
            const angleRad = THREE.MathUtils.degToRad(angleDeg);
            const euler = new THREE.Euler();
            if (axis === 'x') euler.set(angleRad, 0, 0);
            else if (axis === 'y') euler.set(0, angleRad, 0);
            else if (axis === 'z') euler.set(0, 0, angleRad);

            return points.map(p =>
              new THREE.Vector3(...p).multiplyScalar(scale).applyEuler(euler)
            );
          }

          function transformPoints2(points, scale, angleDeg, axis, dx = 0, dz = 0) {
            const angleRad = THREE.MathUtils.degToRad(angleDeg);
            const euler = new THREE.Euler();

            if (axis === 'x') euler.set(angleRad, 0, 0);
            else if (axis === 'y') euler.set(0, angleRad, 0);
            else if (axis === 'z') euler.set(0, 0, angleRad);

            const translation = new THREE.Vector3(dx, 0, dz);

            return points.map(p => {
              return new THREE.Vector3(...p)
                .multiplyScalar(scale)   // scale
                .applyEuler(euler)       // rotate
                .add(translation);       // move
            });
          }

          // === TRANSFORMED POINTS ===
          const vectorPoints = transformPoints2(points_v, SCALE_FACTOR, ROTATION_ANGLE_DEG, ROTATION_AXIS, dx, dz);

          // === CREATE GEOMETRY ===
          const geometry_v = new THREE.BufferGeometry();
          const lineVertices = [];

          edges.forEach(([i1, i2]) => {
            lineVertices.push(...vectorPoints[i1].toArray(), ...vectorPoints[i2].toArray());
          });

          geometry_v.setAttribute('position', new THREE.Float32BufferAttribute(lineVertices, 3));

          // === MATERIAL + MESH ===
          const material_v = new THREE.LineBasicMaterial({ color: 0xffffff });
          const frame_v = new THREE.LineSegments(geometry_v, material_v);
          // frame_v.name = "veh_fra_body"+real_veh_loc_history.length.toString()
          // scene.add(frame_v);
          group.add(frame_v);

        
          // Create wheel geometry (rotated so it's upright)
          const angleRad = THREE.MathUtils.degToRad(ROTATION_ANGLE_DEG);
          const euler = new THREE.Euler();

          if (ROTATION_AXIS === 'x') euler.set(angleRad, 0, 0);
          else if (ROTATION_AXIS === 'y') euler.set(0, angleRad, 0);
          else if (ROTATION_AXIS === 'z') euler.set(0, 0, angleRad);

          
          const wheelRadius = 0.6 * SCALE_FACTOR;
          const wheelThickness = 0.4 * SCALE_FACTOR;
          const wheelMaterial = new THREE.MeshStandardMaterial({ color: 0x222222 });

          const wheelGeo = new THREE.CylinderGeometry(wheelRadius, wheelRadius, wheelThickness, 16);
          wheelGeo.rotateZ(Math.PI / 2); // Rotate so flat faces are vertical


          // Wheel positions: [x, y, z]
          const wheelPositions_raw = [
            [-2.0, 0.3, -3.0], // front left
            [2.0, 0.3, -3.0],  // front right
            [-2.0, 0.3, 3.0],  // rear left
            [2.0, 0.3, 3.0],   // rear right
          ];

          // let wheelPositions = movePoints(wheelPositions_raw, dx/SCALE_FACTOR, 0, dz/SCALE_FACTOR);
          let wheelPositions = movePoints(wheelPositions_raw, 0, 0, 0);
          const translation = new THREE.Vector3(dx, 0, dz);

          wheelPositions.forEach((pos,i) => {
            // Apply transform to position
            const posVec = new THREE.Vector3(...pos)
              .multiplyScalar(SCALE_FACTOR)
              .applyEuler(euler)
              .add(translation); 

            // Create and place the wheel
            const wheel = new THREE.Mesh(wheelGeo.clone(), wheelMaterial);
            wheel.position.copy(posVec);

            // Also rotate the wheel to match car rotation
            wheel.rotation.copy(euler);

            // wheel.name = "veh_fra_wheel_"+i+"_"+real_veh_loc_history.length.toString()
            // scene.add(wheel);
            group.add(wheel);

          });

          // light
           const lightPositions_raw = [
            [-1.0, 0.8, 3.8], // front left
            [1.0, 0.8, 3.8],  // front right
          ];

          // let lightPositions = movePoints(lightPositions_raw, dx/SCALE_FACTOR, 0, dz/SCALE_FACTOR);
          let lightPositions = movePoints(lightPositions_raw, 0, 0, 0);


          const lightMaterial = new THREE.MeshStandardMaterial({ color: 0xff0000});
          const lightGeo = new THREE.SphereGeometry(0.18);

          
          lightPositions.forEach((pos,i) => {
            // Apply transform to position
            const posVec = new THREE.Vector3(...pos)
            .multiplyScalar(SCALE_FACTOR)
            .applyEuler(euler)
            .add(translation); 

            // Create and place the wheel
            const light = new THREE.Mesh(lightGeo.clone(), lightMaterial);
            light.position.copy(posVec);

            // Also rotate the wheel to match car rotation
            light.rotation.copy(euler);

            // light.name = "veh_fra_light_"+i+"_"+real_veh_loc_history.length.toString()
            // scene.add(light);
            group.add(light);

          });
          group.name = "veh_fra"+real_veh_loc_history.length.toString();
          scene.add(group);
        }

        function loadPLYModel() {
            const loader = new THREE.PLYLoader();
            const statusElement = document.getElementById('status');
            
            statusElement.textContent = `Fetching PLY from: ${PLY_FILE_URL}`;

            // Check if the URL is the placeholder
            if (PLY_FILE_URL.includes('path/to/your/model.ply')) {
                statusElement.innerHTML = '<strong>PLEASE UPDATE:</strong> Replace the `PLY_FILE_URL` in the JavaScript with your actual `.ply` file link.';
                // Add a placeholder object since we cannot fetch the user's file
                addPlaceholderCube();
                return;
            }

            loader.load(
                // resource URL
                PLY_FILE_URL,
                // onLoad callback
                function (geometry) {
                    statusElement.textContent = 'Model loaded successfully!';
                    
                    // PLY files can contain vertex colors. 
                    // Use MeshStandardMaterial and check for vertex colors.
                    const material = new THREE.MeshStandardMaterial({
                        color: 0xffffff,
                        vertexColors: geometry.hasAttribute('color'), // Use vertex colors if available
                        flatShading: true 
                    });

                    mesh = new THREE.Mesh(geometry, material);
                    mesh.rotation.x = -Math.PI / 2; // Often PLY models are Z-up, so rotate to Y-up
                    scene.add(mesh);
                    
                    // Recenter camera to look at the loaded model
                    geometry.computeBoundingBox();
                    if (geometry.boundingBox) {
                        const center = new THREE.Vector3();
                        geometry.boundingBox.getCenter(center);
                        controls.target.copy(center);
                        
                        const size = new THREE.Vector3();
                        geometry.boundingBox.getSize(size);
                        const maxDim = Math.max(size.x, size.y, size.z);
                        
                        // Adjust camera distance based on model size
                        const fitDistance = maxDim * 1.5;
                        camera.position.set(center.x, center.y, center.z + fitDistance);
                        camera.far = fitDistance * 2;
                        camera.updateProjectionMatrix();
                    }

                },
                // onProgress callback
                function (xhr) {
                    const progress = (xhr.loaded / xhr.total) * 100;
                    statusElement.textContent = `Loading: ${progress.toFixed(2)}%`;
                },
                // onError callback
                function (error) {
                    console.error('An error occurred while loading the PLY model:', error);
                    statusElement.textContent = 'Error loading model. Check console for details.';
                    addPlaceholderCube();
                }
            );
        }


         // --- Model Loading Function ---
        function loadOBJModel() {
            // Renamed from PLYLoader to OBJLoader
            const loader = new THREE.OBJLoader();
            // const statusElement = document.getElementById('status');
            
            // statusElement.textContent = `Fetching OBJ from: ${OBJ_FILE_URL}`;

            // Check if the URL is the placeholder
            if (OBJ_FILE_URL.includes('static/cad.obj')) {
                addPlaceholderCube();
                return;
            }

            loader.load(
                // resource URL
                OBJ_FILE_URL,
                // onLoad callback
                function (object) {
                    
                    object.traverse(function (child) {
                        if (child.isMesh) {
                            child.material = new THREE.MeshStandardMaterial({
                                color: 0xcccccc,
                                flatShading: true,
                            });
                        }
                    });

                    mesh = object; // 'mesh' now refers to the loaded object group
                    scene.add(mesh);
                    
                    // Recenter camera to look at the loaded model
                    const box = new THREE.Box3().setFromObject(mesh);
                    const center = new THREE.Vector3();
                    box.getCenter(center);
                    controls.target.copy(center);
                    
                    const size = new THREE.Vector3();
                    box.getSize(size);
                    const maxDim = Math.max(size.x, size.y, size.z);
                    
                    // Adjust camera distance based on model size
                    const fitDistance = maxDim * 1.5;
                    camera.position.set(center.x, center.y, center.z + fitDistance);
                    camera.far = fitDistance * 2;
                    camera.updateProjectionMatrix();

                },
                // onProgress callback
                function (xhr) {
                    const progress = (xhr.loaded / xhr.total) * 100;
                },
                // onError callback
                function (error) {
                    addPlaceholderCube();
                }
            );
        }

        // Fallback for when the file cannot be loaded
        function addPlaceholderCube() {
            const geometry = new THREE.BoxGeometry(2, 2, 2);
            const material = new THREE.MeshStandardMaterial({ color: 0xff0000 });
            mesh = new THREE.Mesh(geometry, material);
            scene.add(mesh);
        }




    </script>

        function getSystemTime() {
